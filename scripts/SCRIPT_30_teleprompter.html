<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPT 30 — Execution Phase Begins | Teleprompter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .teleprompter-container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            border: 2px solid #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .controls {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #1a4d7a;
            color: white;
            border: 1px solid #2a7aad;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            background: #2a7aad;
            box-shadow: 0 0 15px rgba(42, 122, 173, 0.5);
        }

        button.active {
            background: #d4a574;
            border-color: #e8c4a0;
            color: #000;
        }

        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        .speed-label, .size-label {
            font-size: 12px;
            color: #888;
            min-width: 40px;
        }

        .script-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        .script-content::-webkit-scrollbar {
            width: 8px;
        }

        .script-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .script-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .script-content::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .section {
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .section-title {
            color: #d4a574;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .timecode {
            color: #666;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .text {
            font-size: 18px;
            line-height: 1.8;
            color: #e0e0e0;
            margin-bottom: 15px;
        }

        .direction {
            color: #888;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 12px;
            padding: 8px;
            border-left: 3px solid #444;
            padding-left: 12px;
        }

        .music-note {
            color: #a0c4ff;
            font-size: 14px;
            margin: 15px 0;
            padding: 10px;
            border-left: 3px solid #5a7aad;
            padding-left: 12px;
            background: rgba(90, 122, 173, 0.1);
        }

        .metadata-section {
            background: rgba(212, 165, 116, 0.08);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }

        .metadata-item {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .metadata-label {
            color: #d4a574;
            font-weight: bold;
        }

        .metadata-value {
            color: #aaa;
        }

        /* Highlight current section on scroll */
        .section.highlighted {
            background: rgba(212, 165, 116, 0.1);
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #d4a574;
        }

        .status-bar {
            background: #111;
            border-top: 1px solid #222;
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .teleprompter-container {
                width: 95%;
                height: 95vh;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .control-group {
                width: 100%;
                flex-wrap: wrap;
            }

            .text {
                font-size: 16px;
            }

            .section-title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="teleprompter-container">
        <div class="controls">
            <div class="control-group">
                <button id="playBtn">▶ Play</button>
                <button id="pauseBtn">⏸ Pause</button>
                <button id="resetBtn">⏹ Reset</button>
            </div>
            <div class="control-group">
                <label class="speed-label">Speed:</label>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
                <span id="speedValue">1.0x</span>
            </div>
            <div class="control-group">
                <label class="size-label">Text Size:</label>
                <input type="range" id="sizeSlider" min="14" max="32" step="1" value="18">
                <span id="sizeValue">18px</span>
            </div>
            <div class="control-group">
                <button id="darkMode" class="active">🌙 Dark</button>
                <button id="lightMode">☀️ Light</button>
            </div>
        </div>

        <div class="script-content" id="scriptContent">
            <!-- Script will be dynamically loaded here -->
        </div>

        <div class="status-bar">
            <span id="statusTime">Time: 0:00</span>
            <span id="statusDuration">Duration: 6:35</span>
        </div>
    </div>

    <script>
        // Script data
        const scriptData = [
            {
                section: "OPENING",
                timecode: "0:00-0:25",
                direction: "Silence. Not empty. Heavy. The silence of a courtroom after the verdict is read. Then: a single, definitive gavel strike. Not angry. Final. Then that silence again.",
                text: "The test ended.\n\nNot with a bang. With a gavel."
            },
            {
                section: "THE REVELATION",
                timecode: "0:25-1:15",
                direction: "Low pulse enters — steady, unchanging, like a heartbeat that's done doubting. Cello underneath, ancient, certain.",
                text: "You spent the last season proving things.\n\nProving your worth. Proving your clarity. Proving that you could see through the mirror when the system kept sending copies of itself wearing your lover's face.\n\nAnd you passed.\n\nNot because you won an argument. Because you stopped having it.\n\nYou moved from the courtroom to the observation deck.\n\nAnd from the observation deck, everything looks different.\n\nThe twin flame wasn't your destiny. It was your final examination.\n\nThe destroyer wasn't your enemy. It was your teacher.\n\nAnd the system wasn't something to fight. It was something to understand — so completely that fighting it becomes unnecessary.\n\nBecause you don't fight a pattern you've already decoded."
            },
            {
                section: "WHAT THE CHANNELS ARE SAYING",
                timecode: "1:15-2:05",
                direction: "Strings rise — but not triumphantly. Inevitably. Like watching dominos fall in slow motion.",
                text: "Every chosen one space is saying the same thing right now:\n\n\"You're not in the test phase anymore.\"\n\nThe channels are lit up. Not with fear. With recognition.\n\nThere's a frequency shift happening. Not just for you. For all of them.\n\nThe chosen ones are waking up to the exact same thing at the exact same moment:\n\nThe system's final play didn't work.\n\nThe narcissistic structure sent its final messenger. It deployed its best weapon — the twin flame, the destroyer, the one calibrated to break you by making you question whether God's love is real.\n\nAnd it failed.\n\nNot because you fought it.\n\nBecause you recognized it.\n\nAnd when a chosen one recognizes the trap, the trap no longer has any power."
            },
            {
                section: "THE TRANSITION FROM TEST TO EXECUTION",
                timecode: "2:05-3:10",
                direction: "Music pulls back. Stark. Just pulse and cello. The space between the notes matters now. Each note is a decision.",
                text: "Here's what you need to understand about this moment:\n\nYou were in the test phase when the system could still break you with doubt.\n\nYou were being forged. Tempered. Run through every trial the system could design.\n\nAnd you came out the other side not just intact — you came out seeing.\n\nBut the test only meant something if what came after meant something.\n\nThe execution phase isn't about being tested anymore.\n\nIt's about being used.\n\nGod doesn't clear a path for someone who still has doubts.\n\nGod doesn't calibrate a chosen one's frequency and then leave them in the courtroom arguing with the system.\n\nGod moves you to what you were actually built for.\n\nAnd right now — while every narcissistic structure on the planet is scrambling because its final weapon failed — that's when the chosen ones get mobilized."
            },
            {
                section: "WHAT THE DIVINE MASCULINE AND FEMININE ARE DOING",
                timecode: "3:10-4:00",
                direction: "Piano enters — heavy, declarative. No apology. No explanation. Just power building.",
                text: "The divine masculine has already moved.\n\nFrom proving to presence.\nFrom defense to direction.\nFrom protecting the wound to leading the mission.\n\nThe divine feminine has already moved.\n\nFrom seeking validation in the mirror to seeing herself through the truth.\n\nFrom accepting the distraction to recognizing she's the architect.\n\nAnd when both move — when the chosen one's masculine and feminine principles align — there's no force in the system that can interrupt that.\n\nYou spent months in the test phase getting the two parts of yourself to recognize each other.\n\nThe destroyer was designed to split you. To make the masculine want to protect, even when protection meant staying. To make the feminine want to heal, even when healing meant accepting the unacceptable.\n\nBut you didn't split.\n\nYou locked.\n\nAnd now both parts are moving in the same direction."
            },
            {
                section: "THE SYSTEM'S FINAL DESPERATION",
                timecode: "4:00-4:50",
                direction: "Music swells — not angry, but inevitable. Like the sun rising over a city that built walls to block it.",
                text: "The system is in its endgame.\n\nNot because you attacked it. Because it realized you're not playing anymore.\n\nThe narcissistic structure was built on a simple principle: keep the chosen one engaged. Keep them talking, defending, explaining, proving. Keep their energy running through the system's circuits.\n\nBut the chosen one went silent.\n\nThen the chosen one went clear.\n\nThen the chosen one recognized exactly what was happening.\n\nAnd now the chosen one has a mission that has nothing to do with the system anymore.\n\nThat's when the system realizes: it's already lost.\n\nBecause the power of a chosen one was never meant to fight the system.\n\nIt was meant to build something the system can't touch."
            },
            {
                section: "THE MISSION ACTIVATES",
                timecode: "4:50-5:40",
                direction: "Full orchestral swell — French horns, timpani, strings all moving in unison. But it's not noise. It's clarity in sound form.",
                text: "This is what execution phase means:\n\nYou're not in the test anymore. You're in the build.\n\nEvery person the system was using against you? They're moving to the sidelines now. Some of them are waking up. Some of them are just becoming irrelevant because you're not looking at them anymore.\n\nYour frequency is shifting.\n\nFrom \"am I enough?\" to \"what am I building?\"\n\nFrom \"do they see me?\" to \"what do I see?\"\n\nFrom \"will they ever understand?\" to \"I don't need them to.\"\n\nThe chosen one in execution phase operates under different physics.\n\nDifferent law.\n\nYou're not asking permission. You're not seeking validation. You're not waiting for anyone else to get it.\n\nYou're moving.\n\nAnd the people around you are either moving with you — because they recognize the frequency — or they're getting left behind.\n\nNot cruelty. Just math."
            },
            {
                section: "THE FINAL TRANSMISSION",
                timecode: "5:40-6:15",
                direction: "Music becomes one sustained, unbreakable tone — cello and French horn in absolute unison. It's not beautiful. It's true.",
                text: "Tyler.\n\nThe test had to break you down to the truth.\n\nThe destroyer had to show you what you'd accept and what you wouldn't.\n\nThe twin flame had to teach you the difference between love and frequency.\n\nAnd you learned.\n\nNow the system has nothing left.\n\nIt sent its final messenger. You recognized the voice and didn't answer.\n\nIt deployed its final weapon. You decoded it and moved on.\n\nIt built its final case against you. You realized you were never on trial.\n\nThe gavel came down.\n\nAnd the test phase ended."
            },
            {
                section: "POWER CLOSE",
                timecode: "6:15-6:35",
                direction: "The sustained tone holds. Then — just before the end — the sound of a door opening. Not behind you. In front of you. New. Unwritten. Full of motion.",
                text: "You're not in the courtroom anymore, Tyler.\n\nYou're on the other side of the verdict.\n\nNow watch what the chosen one does when the test is finally over.\n\nNow watch what two people can build when the system has no counter for them.\n\nNow watch the execution phase begin."
            },
            {
                section: "METADATA",
                timecode: "",
                text: ""
            }
        ];

        // DOM elements
        const scriptContent = document.getElementById('scriptContent');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const darkModeBtn = document.getElementById('darkMode');
        const lightModeBtn = document.getElementById('lightMode');
        const statusTime = document.getElementById('statusTime');
        const statusDuration = document.getElementById('statusDuration');

        let isPlaying = false;
        let currentTime = 0;
        const totalDuration = 395; // 6:35 in seconds

        // Build HTML from script data
        function buildScriptHTML() {
            let html = '';
            scriptData.forEach((item, index) => {
                html += `<div class="section" data-index="${index}">`;
                if (item.section) {
                    html += `<div class="section-title">${item.section}</div>`;
                }
                if (item.timecode) {
                    html += `<div class="timecode">${item.timecode}</div>`;
                }
                if (item.direction) {
                    html += `<div class="direction">${item.direction}</div>`;
                }
                if (item.text) {
                    html += `<div class="text">${item.text.replace(/\n/g, '<br>')}</div>`;
                }
                html += '</div>';
            });
            scriptContent.innerHTML = html;
        }

        // Format time display
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Update status bar
        function updateStatus() {
            statusTime.textContent = `Time: ${formatTime(currentTime)}`;
        }

        // Play functionality
        function play() {
            isPlaying = true;
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            
            const interval = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(interval);
                    return;
                }
                
                currentTime += 0.1 / speedSlider.value;
                updateStatus();
                
                if (currentTime >= totalDuration) {
                    currentTime = totalDuration;
                    isPlaying = false;
                    playBtn.disabled = false;
                    pauseBtn.disabled = true;
                    clearInterval(interval);
                }
            }, 100);
        }

        // Pause functionality
        function pause() {
            isPlaying = false;
            playBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        // Reset functionality
        function reset() {
            isPlaying = false;
            currentTime = 0;
            updateStatus();
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            scriptContent.scrollTop = 0;
        }

        // Event listeners
        playBtn.addEventListener('click', play);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);

        speedSlider.addEventListener('input', (e) => {
            speedValue.textContent = parseFloat(e.target.value).toFixed(1) + 'x';
        });

        sizeSlider.addEventListener('input', (e) => {
            sizeValue.textContent = e.target.value + 'px';
            document.querySelectorAll('.text').forEach(el => {
                el.style.fontSize = e.target.value + 'px';
            });
        });

        darkModeBtn.addEventListener('click', () => {
            document.body.style.background = '#0a0a0a';
            document.querySelector('.teleprompter-container').style.background = 'linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%)';
            darkModeBtn.classList.add('active');
            lightModeBtn.classList.remove('active');
        });

        lightModeBtn.addEventListener('click', () => {
            document.body.style.background = '#ffffff';
            document.querySelector('.teleprompter-container').style.background = 'linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%)';
            document.querySelector('.script-content').style.color = '#000000';
            document.querySelectorAll('.text').forEach(el => {
                el.style.color = '#1a1a1a';
            });
            lightModeBtn.classList.add('active');
            darkModeBtn.classList.remove('active');
        });

        // Initialize
        buildScriptHTML();
        updateStatus();
        pauseBtn.disabled = true;
    </script>
</body>
</html>
