<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Georgia',serif; overflow:hidden; }

#controls {
  position:fixed; top:0; left:0; right:0;
  background:rgba(0,0,0,0.95);
  border-bottom:2px solid #c0392b;
  padding:10px 20px;
  display:flex; align-items:center; gap:14px;
  z-index:200; flex-wrap:wrap;
}
#controls button {
  background:#c0392b; color:#fff; border:none;
  padding:8px 16px; font-size:13px; font-weight:bold;
  border-radius:4px; cursor:pointer; letter-spacing:1px;
  transition:background 0.2s;
}
#controls button:hover { background:#e74c3c; }
#controls button.active { background:#27ae60; }
#controls button.blue { background:#2980b9; }
label { color:#aaa; font-size:12px; }
input[type=range] { accent-color:#c0392b; cursor:pointer; }

#script-selector {
  position:fixed; top:56px; left:0; right:0;
  background:#111; border-bottom:1px solid #333;
  padding:8px 20px; display:flex; gap:8px; overflow-x:auto;
  z-index:199; scrollbar-width:thin;
}
.script-btn {
  background:#1a1a1a; border:1px solid #333; color:#ccc;
  padding:6px 14px; border-radius:20px; cursor:pointer;
  font-size:12px; white-space:nowrap; transition:all 0.2s;
}
.script-btn:hover, .script-btn.active { background:#c0392b; border-color:#c0392b; color:#fff; }

#title-bar {
  position:fixed; top:98px; left:0; right:0;
  background:linear-gradient(90deg,#c0392b,#8e1a0e);
  text-align:center; padding:7px;
  font-size:12px; font-weight:bold; letter-spacing:3px;
  text-transform:uppercase; z-index:198;
}

#teleprompter {
  position:fixed; top:130px; bottom:0; left:0; right:0;
  overflow-y:auto; scroll-behavior:smooth;
}
#scroll-content {
  padding:50px 12% 70vh;
  font-size:36px; line-height:1.9;
}

.music-cue { display:block; color:#e74c3c; font-size:17px; font-style:italic;
  letter-spacing:2px; text-transform:uppercase; margin:28px 0 8px;
  border-left:4px solid #c0392b; padding-left:14px; }
.section-marker { display:block; color:#f39c12; font-size:14px; font-weight:bold;
  letter-spacing:4px; text-transform:uppercase; margin:36px 0 6px; opacity:0.7; }
.pause-cue { display:block; color:#3498db; font-size:15px; font-style:italic;
  margin:6px 0; letter-spacing:1px; }
.line { display:block; margin-bottom:4px; }
.em { color:#e74c3c; font-weight:bold; }
.breath { display:block; height:28px; }
.script-divider { display:block; border-top:2px solid #333; margin:60px 0 40px;
  text-align:center; font-size:13px; color:#555; letter-spacing:4px; padding-top:16px; }
.url-cue { display:block; color:#8e44ad; font-size:14px; font-style:italic; margin:6px 0; }

#fade-top, #fade-bottom {
  position:fixed; left:0; right:0; pointer-events:none; z-index:197;
}
#fade-top { top:130px; height:80px; background:linear-gradient(to bottom,#000,transparent); }
#fade-bottom { bottom:0; height:100px; background:linear-gradient(to top,#000,transparent); }
#crosshair { position:fixed; top:50%; left:0; right:0; height:2px;
  background:rgba(192,57,43,0.25); z-index:196; pointer-events:none; }

.progress-bar { position:fixed; bottom:0; left:0; height:3px;
  background:#c0392b; z-index:300; transition:width 0.1s; }
</style>
</head>

// ============================================================
// ENGINE
// ============================================================
let currentScript = 0;
let scrolling = false;
let speed = 1.3;
let animFrame;
let lastTime = null;
let scrollPos = 0;
let mirrored = false;
let brightMode = false;

const tp = document.getElementById('teleprompter');
const content = document.getElementById('scroll-content');

function showScript(idx) {
  currentScript = idx;
  const s = scripts[idx];
  content.innerHTML = `
    <div style="text-align:center;margin-bottom:40px;">
      <div style="color:#e74c3c;font-size:14px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;">${s.suggestedTitle}</div>
      <span class="music-cue" style="text-align:left;">${s.musicIntro}</span>
    </div>
    ${s.content}
  `;
  document.getElementById('title-bar').textContent = `🎬 ${s.title} | ANTER TELEPROMPTER`;
  document.querySelectorAll('.script-btn').forEach((b,i) => {
    b.classList.toggle('active', i === idx);
  });
  resetScroll();
}

function togglePlay() {
  scrolling = !scrolling;
  const btn = document.getElementById('playBtn');
  if (scrolling) {
    btn.textContent = '⏸ PAUSE'; btn.classList.add('active');
    lastTime = null; animate();
  } else {
    btn.textContent = '▶ PLAY'; btn.classList.remove('active');
    cancelAnimationFrame(animFrame);
  }
}

function animate(ts) {
  if (!scrolling) return;
  if (!lastTime) lastTime = ts;
  const delta = ts - lastTime; lastTime = ts;
  scrollPos += speed * delta * 0.05;
  tp.scrollTop = scrollPos;
  updateProgress();
  if (tp.scrollTop + tp.clientHeight >= tp.scrollHeight - 20) {
    scrolling = false;
    document.getElementById('playBtn').textContent = '▶ PLAY';
    document.getElementById('playBtn').classList.remove('active');
    return;
  }
  animFrame = requestAnimationFrame(animate);
}

function resetScroll() {
  scrolling = false; scrollPos = 0; tp.scrollTop = 0; lastTime = null;
  cancelAnimationFrame(animFrame);
  document.getElementById('playBtn').textContent = '▶ PLAY';
  document.getElementById('playBtn').classList.remove('active');
  updateProgress();
}

function updateProgress() {
  const pct = tp.scrollHeight > tp.clientHeight
    ? (tp.scrollTop / (tp.scrollHeight - tp.clientHeight)) * 100 : 0;
  document.getElementById('progress').style.width = pct + '%';
}

function updateSpeed() {
  speed = parseFloat(document.getElementById('speed').value);
  document.getElementById('speed-val').textContent = speed.toFixed(1);
}

function updateFont() {
  const sz = document.getElementById('font-sz').value;
  content.style.fontSize = sz + 'px';
  document.getElementById('font-val').textContent = sz + 'px';
}

function toggleMirror() {
  mirrored = !mirrored;
  content.style.transform = mirrored ? 'scaleX(-1)' : 'scaleX(1)';
  document.getElementById('mirrorBtn').textContent = mirrored ? '↔ MIRROR ON' : '↔ MIRROR';
}

function toggleDark() {
  brightMode = !brightMode;
  document.body.style.background = brightMode ? '#1a1a1a' : '#000';
  content.style.color = brightMode ? '#f0f0f0' : '#fff';
  document.getElementById('darkBtn').textContent = brightMode ? '🌙 DARK' : '☀ BRIGHT';
}

function nextScript() {
  showScript((currentScript + 1) % scripts.length);
}

function prevScript() {
  showScript((currentScript - 1 + scripts.length) % scripts.length);
}

tp.addEventListener('scroll', () => { if (!scrolling) scrollPos = tp.scrollTop; updateProgress(); });

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextScript();
  if (e.code === 'ArrowLeft') prevScript();
  if (e.code === 'ArrowUp') { speed = Math.min(5, speed + 0.2); document.getElementById('speed').value = speed; updateSpeed(); }
  if (e.code === 'ArrowDown') { speed = Math.max(0.2, speed - 0.2); document.getElementById('speed').value = speed; updateSpeed(); }
});

// Init
showScript(0);
</script>
