}
#scroll-content {

</head>

// ===================== RENDER ENGINE =====================
var currentScript = 0;
var scrolling = false;
var speed = 1.3;
var rafId = null;
var lastTs = null;
var pos = 0;
var mirrored = false;
var bright = false;

var tp = document.getElementById('teleprompter');
var sc = document.getElementById('scroll-content');
var titleBar = document.getElementById('title-bar');
var progress = document.getElementById('progress-bar');

function renderBody(body) {
  var html = '';
  for (var i = 0; i < body.length; i++) {
    var item = body[i];
    if (item.t === 'line')    html += '<span style="display:block;">' + esc(item.v) + '</span>';
    else if (item.t === 'em') html += '<span style="display:block;color:#e74c3c;font-weight:bold;">' + esc(item.v) + '</span>';
    else if (item.t === 'breath') html += '<span style="display:block;height:28px;"></span>';
    else if (item.t === 'section') html += '<span style="display:block;color:#f39c12;font-size:14px;font-weight:bold;letter-spacing:4px;text-transform:uppercase;margin:36px 0 6px;opacity:0.7;">' + esc(item.v) + '</span>';
    else if (item.t === 'music') html += '<span style="display:block;color:#e74c3c;font-size:17px;font-style:italic;letter-spacing:2px;text-transform:uppercase;margin:28px 0 8px;border-left:4px solid #c0392b;padding-left:14px;">' + esc(item.v) + '</span>';
    else if (item.t === 'pause') html += '<span style="display:block;color:#3498db;font-size:16px;font-style:italic;margin:8px 0;">' + esc(item.v) + '</span>';
    else if (item.t === 'url')   html += '<span style="display:block;color:#8e44ad;font-size:14px;margin:6px 0;">' + esc(item.v) + '</span>';
  }
  return html;
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showScript(idx) {
  currentScript = idx;
  var s = scripts[idx];
  var html = '<div style="text-align:center;margin-bottom:40px;">';
  html += '<div style="color:#e74c3c;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">' + esc(s.suggested) + '</div>';
  html += '<div style="color:#e74c3c;font-size:15px;font-style:italic;border-left:4px solid #c0392b;padding-left:14px;text-align:left;">' + esc(s.music) + '</div>';
  html += '<div style="color:#555;font-size:13px;margin-top:8px;">' + esc(s.seo) + '</div>';
  html += '</div>';
  html += renderBody(s.body);
  sc.innerHTML = html;
  titleBar.textContent = '\uD83C\uDFAC ' + s.title + ' | ANTER';
  var btns = document.querySelectorAll('.script-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', i === idx);
  }
  resetScroll();
}

function togglePlay() {
  scrolling = !scrolling;
  var btn = document.getElementById('playBtn');
  if (scrolling) {
    btn.textContent = '\u23F8 PAUSE';
    btn.classList.add('active');
    lastTs = null;
    rafId = requestAnimationFrame(animate);
  } else {
    btn.textContent = '\u25B6 PLAY';
    btn.classList.remove('active');
    cancelAnimationFrame(rafId);
  }
}

function animate(ts) {
  if (!scrolling) return;
  if (!lastTs) lastTs = ts;
  var delta = ts - lastTs;
  lastTs = ts;
  pos += speed * delta * 0.05;
  tp.scrollTop = pos;
  updateProgress();
  if (tp.scrollTop + tp.clientHeight >= tp.scrollHeight - 30) {
    scrolling = false;
    document.getElementById('playBtn').textContent = '\u25B6 PLAY';
    document.getElementById('playBtn').classList.remove('active');
    return;
  }
  rafId = requestAnimationFrame(animate);
}

function resetScroll() {
  scrolling = false;
  pos = 0;
  tp.scrollTop = 0;
  lastTs = null;
  cancelAnimationFrame(rafId);
  document.getElementById('playBtn').textContent = '\u25B6 PLAY';
  document.getElementById('playBtn').classList.remove('active');
  updateProgress();
}

function updateProgress() {
  var pct = tp.scrollHeight > tp.clientHeight
    ? (tp.scrollTop / (tp.scrollHeight - tp.clientHeight)) * 100 : 0;
  progress.style.width = pct + '%';
}

function updateSpeed(val) {
  speed = parseFloat(val);
  document.getElementById('speedVal').textContent = ' ' + speed.toFixed(1);
}

function updateFont(val) {
  sc.style.fontSize = val + 'px';
  document.getElementById('fontVal').textContent = ' ' + val + 'px';
}

function toggleMirror() {
  mirrored = !mirrored;
  sc.style.transform = mirrored ? 'scaleX(-1)' : 'scaleX(1)';
  document.getElementById('mirrorBtn').textContent = mirrored ? '\u2194 ON' : '\u2194 MIRROR';
}

function toggleBright() {
  bright = !bright;
  document.body.style.background = bright ? '#111' : '#000';
  sc.style.color = bright ? '#f5f5f5' : '#fff';
  document.getElementById('brightBtn').textContent = bright ? '\uD83C\uDF19 DARK' : '\u2600 BRIGHT';
}

function nextScript() { showScript((currentScript + 1) % scripts.length); }
function prevScript() { showScript((currentScript - 1 + scripts.length) % scripts.length); }

tp.addEventListener('scroll', function() { if (!scrolling) pos = tp.scrollTop; updateProgress(); });

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextScript();
  if (e.code === 'ArrowLeft') prevScript();
  if (e.code === 'ArrowUp') { speed = Math.min(6, speed + 0.2); document.getElementById('speedSlider').value = speed; updateSpeed(speed); }
  if (e.code === 'ArrowDown') { speed = Math.max(0.2, speed - 0.2); document.getElementById('speedSlider').value = speed; updateSpeed(speed); }
});

showScript(0);
</script>

</html>
